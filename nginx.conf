# ─────────────────────────────────────────────────────────────────────────────
# CinemaScope — Nginx Configuration
# Optimized for React SPA (HashRouter) with static asset caching and compression
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # Note: CSP not set here because TMDB images and Supabase endpoints vary.
    # Add a strict CSP after auditing all external origins.

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite hashes filenames on build — these can be cached for 1 year
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── SPA routing ──────────────────────────────────────────────────────────
    # HashRouter handles all client-side routing via the hash fragment (#/).
    # Only index.html needs to be served for all routes.
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html so users always get the latest app
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Hide server version ───────────────────────────────────────────────────
    server_tokens off;
}
